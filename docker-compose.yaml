version: "3.9"

services:

  model-server:
    build: ./model-server
    container_name: model-server
    runtime: nvidia

    ports:
        - "8000:8000"

    env_file:
        - .env

    restart: unless-stopped


  poetry-app:
    build: ./app
    container_name: poetry-app

    ports:
      - "8501:8501"

    depends_on:
      - model-server

    restart: unless-stopped