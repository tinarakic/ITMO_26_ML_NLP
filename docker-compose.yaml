version: "3.9"

services:

  model-server:
    build: ./model-server
    container_name: model-server

    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=0

    ports:
      - "8000:8000"

    restart: unless-stopped


  poetry-app:
    build: ./app
    container_name: poetry-app

    ports:
      - "8501:8501"

    depends_on:
      - model-server

    restart: unless-stopped